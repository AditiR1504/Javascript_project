
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'poppins,sans-serif';
            box-sizing: border-box;

        }

        body {
            background-color: #002339;
            color: #fff;
        }

        .conatiner {
            margin: 12%;
            width: 90%;
            max-width: 700px;
        }

        .display {
            width: 100%;
            margin-top: 50px;
            margin-bottom: 30px;
            background-color: white;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 20px;
            border-radius: 5px;
        }

        .conatiner h1 {
            font-weight: 500;
            font-size: 45px;
        }

        .conatiner h1 span {
            color: #019f55;
            border-bottom: 4px solid #019f55;
            padding-bottom: 7px;
        }

        .display input {
            border: 0;
            outline: 0;
            font-size: 25px;
        }


        .conatiner button {
            border: 0;
            outline: 0;
            background-color: #019f55;
            color: #fff;
            font-size: 22px;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 26px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="conatiner">
        <h1>Generate a<br><span>Random Password</span></h1>
        <div class="display">
            <input type="'text" id="password" placeholder=" Password">

        </div>
        <button onclick="createPassword()"> Generate Password</button>
    </div>

    <script src="script.js">
      
    </script>
</body>
